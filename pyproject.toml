[project]
name = "surecast"
version = "0.1.0"
description = "Hourly demand forecasting with calibrated prediction intervals (conformalized quantile regression) and SHAP explainability"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "shap>=0.46",
    # shap pulls numba/llvmlite; floors below keep the resolver on Python-3.12-capable builds
    "numba>=0.60",
    "llvmlite>=0.43",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "streamlit>=1.38",
]

[project.scripts]
surecast = "surecast.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
